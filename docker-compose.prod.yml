
services:
  postgresql:
    image: postgres:14.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fastapi-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2.7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: cinema_booking_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "alembic upgrade head && uvicorn core.server:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build: .
    container_name: cinema_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - C_FORCE_ROOT=1
    command: ["celery", "-A", "worker:celery_app", "worker", "--beat", "--pool=solo", "--loglevel=info"]

  minio:
    image: minio/minio
    container_name: cinema_minio
    restart: unless-stopped

    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    container_name: cinema_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      - api

volumes:
  redis_data:
  pgdata:
  minio_data:
