

services:
  postgresql:
    image: postgres:14.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: fastapi-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2.7
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  api:
    build: .
    container_name: cinema_booking_api
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@postgresql:5432/fastapi-db
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./:/home/app
      - /home/app/.venv
    command: sh -c "alembic upgrade head && uvicorn core.server:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    container_name: cinema_celery_worker
    env_file:
      - .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - C_FORCE_ROOT=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@postgresql:5432/fastapi-db
    volumes:
      - ./:/home/app
      - /home/app/.venv
    command: ["celery", "-A", "worker:celery_app", "worker", "--pool=solo", "--loglevel=info"]


  minio:
    image: minio/minio
    container_name: cinema_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  nginx:
    image: nginx:alpine
    container_name: cinema_nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  redis:
  pgdata:
