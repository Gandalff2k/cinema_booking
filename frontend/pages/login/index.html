<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вхід | Cinema Booking</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/pages/login/style.css">
<script src="/pages/login/script.js" defer></script>
</head>
<body class="auth-page">
    <div class="glass-panel auth-container">
        
        <div class="auth-tabs">
            <button class="tab-btn active" data-target="login-form">Вхід</button>
            <button class="tab-btn" data-target="register-form">Реєстрація</button>
        </div>

    <form id="login-form" class="auth-form active">
            <div class="header-text">
                <h2>З поверненням!</h2>
                <p>Увійдіть, щоб забронювати квитки</p>
            </div>
            
            <div class="input-group">
                <label>Email або Телефон</label>
                <input type="text" id="login-contact" required placeholder="name@example.com або +380...">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            
            <p id="login-error" class="error-msg"></p>
            <button type="submit" class="btn-primary">Увійти</button>
        </form>

        
        <form id="register-form" class="auth-form">
            <div class="header-text">
                <h2>Створити акаунт</h2>
                <p>Приєднуйтесь до нашого кінотеатру</p>
            </div>
            
            <div class="input-group">
                <label>Нікнейм</label>
                <input type="text" id="reg-username" required placeholder="cinemafan">
            </div>
         <div class="input-group">
    <label>Email</label>
    <input type="email" id="reg-contact" required placeholder="name@example.com">
</div>
<div class="input-group">
    <label>Пароль</label>
    <input type="password" id="reg-password" required placeholder="Мінімум 8 символів">
</div>
<div class="input-group">
    <label>Повторіть пароль</label>
    <input type="password" id="reg-password-confirm" required placeholder="Повторіть пароль">
</div>

            <p id="reg-error" class="error-msg"></p>
            <button type="submit" class="btn-primary">Зареєструватися</button>
        </form>

    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
  
</body>
</html>
