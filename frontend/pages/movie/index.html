<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Про фільм | Cinema Booking</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/pages/movie/style.css">
<script src="/pages/movie/script.js" defer></script>
</head>
<body>
    <header class="navbar glass-panel">
        <div class="logo" style="cursor:pointer;" onclick="window.location.href='../home/index.html'">🍿 CinemaX</div>
        <div class="nav-actions">
            <button id="auth-btn" class="btn-primary" onclick="window.location.href='../login/index.html'">Увійти</button>
        </div>
    </header>

    <main class="container">
        <div class="movie-hero glass-panel">
            <img id="movie-poster" src="" alt="Постер" class="hero-poster">
            
            <div class="hero-info">
                <h1 id="movie-title">Завантаження...</h1>
                <p id="movie-tags" class="tags"></p>
                <p id="movie-description" class="description"></p>
                
                <div id="movie-director" class="director"></div>
                <div id="movie-cast" class="cast"></div>
            </div>
        </div>

        <div class="dates-section">
            <h2>Оберіть сеанс:</h2>
            <div class="dates-flex" id="shows-list">
            </div>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    
</body>
</html>
