<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · CinemaX</title>
    <link rel="stylesheet" href="/assets/css/global.css?v=4" />
    <link rel="stylesheet" href="/pages/admin/style.css?v=4" />
    <script src="/pages/admin/script.js?v=4" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="logo" style="cursor:pointer;"
             onclick="window.location.href='../home/index.html'">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
                <path d="M7 3v18M3 7.5h4M17 7.5h4M3 12h18M3 16.5h4M17 16.5h4M17 3v18"/>
            </svg>
            CinemaX · Admin
        </div>
        <div class="nav-actions">
            <button class="btn-secondary" onclick="window.location.href='stats.html'">Statistics</button>
            <button id="logout-btn" class="btn-secondary">Log out</button>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="movies">Movies</button>
            <button class="admin-tab" data-tab="reviews">Reviews</button>
            <button class="admin-tab" data-tab="orders">Orders</button>
        </div>

        <!-- Movies -->
        <section class="admin-panel active" id="tab-movies">
            <form id="movie-form" class="admin-form">
                <h3>Add a movie</h3>
                <div class="form-grid">
                    <input id="m-title" placeholder="Title" required />
                    <input id="m-poster" placeholder="/media/movies/file.jpg" />
                    <input id="m-duration" type="number" min="1" placeholder="Duration (min)" required />
                    <input id="m-age" placeholder="Age (16+)" />
                </div>
                <textarea id="m-description" placeholder="Description"></textarea>
                <button type="submit" class="btn-primary">Create</button>
            </form>

            <div class="admin-toolbar">
                <input id="movie-search" class="admin-search" placeholder="Search by title…" />
                <select id="movie-genre" class="admin-filter">
                    <option value="">All genres</option>
                </select>
            </div>
            <div class="admin-table-wrap"><table class="admin-table" id="movies-table"></table></div>
            <button class="load-more-btn" id="movies-more" hidden>Load more</button>
            <input type="file" id="poster-input" accept="image/png,image/jpeg,image/webp" hidden />
        </section>

        <!-- Reviews -->
        <section class="admin-panel" id="tab-reviews">
            <div class="admin-toolbar">
                <input id="review-search" class="admin-search" placeholder="Search by movie or comment…" />
            </div>
            <div class="admin-table-wrap"><table class="admin-table" id="reviews-table"></table></div>
            <button class="load-more-btn" id="reviews-more" hidden>Load more</button>
        </section>

        <!-- Orders -->
        <section class="admin-panel" id="tab-orders">
            <div class="admin-toolbar">
                <input id="order-email" class="admin-search" placeholder="Search by customer email…" />
            </div>
            <div class="admin-table-wrap"><table class="admin-table" id="orders-table"></table></div>
            <button class="load-more-btn" id="orders-more" hidden>Load more</button>
        </section>
    </main>

    <script src="/assets/js/api.js?v=4"></script>
    <script src="/assets/js/auth.js?v=4"></script>
</body>
</html>
