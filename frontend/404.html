<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | CinemaX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            text-align: center;
            padding: 24px;
        }
        .card { max-width: 480px; }
        .emoji { font-size: 64px; margin-bottom: 8px; }
        .code {
            font-size: 88px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 24px; margin: 16px 0 8px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover { background: #0284c7; box-shadow: 0 0 24px rgba(56,189,248,0.4); }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎬</div>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>Looks like this showing has ended. Check the address
           or head back to the listings.</p>
        <a class="btn" href="/pages/home/index.html">Back to listings</a>
    </div>
</body>
</html>
