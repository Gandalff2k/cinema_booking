name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:6.2.7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:14.2-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cinema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cinema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/cinema_ci
      REDIS_URL: redis://localhost:6379/0
      EMAILS_ENABLED: "False"
      RATE_LIMIT_ENABLED: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff (lint + format check)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14.2-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cinema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cinema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/cinema_ci
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Apply migrations on a real Postgres
        run: poetry run alembic upgrade head
