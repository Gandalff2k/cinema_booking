name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:6.2.7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:14.2-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cinema_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d cinema_ci" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/cinema_ci
      REDIS_URL: redis://localhost:6379/0
      EMAILS_ENABLED: "False"
      RATE_LIMIT_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true
      - run: poetry install --no-interaction
      - run: poetry run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Resolve deployment ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            echo "target_ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

     
      - name: Debug secret length (safe — no content printed)
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "VM_SSH_KEY length: ${#KEY} characters"
          echo "VM_SSH_KEY line count: $(printf '%s' "$KEY" | wc -l)"
          echo "First line starts with '-----BEGIN': $(printf '%s' "$KEY" | head -n1 | grep -c '\-\-\-\-\-BEGIN')"
          echo "Last line starts with '-----END': $(printf '%s' "$KEY" | tail -n1 | grep -c '\-\-\-\-\-END')"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VM_APP_PATH }}"
            TARGET_REF="${{ steps.ref.outputs.target_ref }}"
            git fetch --prune origin "$TARGET_REF"
            git checkout --detach FETCH_HEAD
            docker compose up -d --build --remove-orphans
            docker image prune -f
