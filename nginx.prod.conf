
server_names_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_comp_level 6;

    large_client_header_buffers 4 16k;

    # Must stay above the app's own poster-upload cap (5 MB, see api/v1/admin.py)
    # or nginx rejects the upload with a raw 413 before the app ever sees it.
    client_max_body_size 6m;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }

    location / {
        root /usr/share/nginx/html;
        index pages/home/index.html;
        try_files $uri $uri/ /pages/home/index.html;

        location ~* \.(css|js|ico)$ {
            add_header Cache-Control "no-cache";
        }
    }

    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        proxy_pass http://$api_host:8000$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}
