server_names_hash_bucket_size 128;

server {
    listen 80;
    server_name localhost cinemax.yourdomain.com; 
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_comp_level 6;

    large_client_header_buffers 4 16k;

    # Must stay above the app's own poster-upload cap (5 MB, see api/v1/admin.py)
    # or nginx rejects the upload with a raw 413 before the app ever sees it.
    client_max_body_size 6m;

    # Branded error pages (shown instead of the default nginx html)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }

    location / {
        root /usr/share/nginx/html;
        index pages/home/index.html;
        try_files $uri $uri/ /pages/home/index.html;

        # Static is cached but always revalidated (304 when unchanged) — fast,
        # yet a new deploy shows up without a forced hard-refresh.
        location ~* \.(css|js|ico)$ {
            add_header Cache-Control "no-cache";
        }
    }


    location /media/ {
        proxy_pass http://minio:9000/; 
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }


    location /v1/ {
        # Re-resolve the `api` hostname at request time via Docker's embedded DNS,
        # so a recreated api container (new IP) never leaves nginx on a stale IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        proxy_pass http://$api_host:8000$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        proxy_set_header X-Forwarded-Proto http;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}